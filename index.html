<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>返信文案コピー</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --sub:#6b6b66; --line:#ddd; --btn:#1a7f5a; --btnfg:#fff; --ok:#0b5cad; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#222220; --fg:#ecece8; --sub:#a0a09a; --line:#3a3a37; --btn:#2fa477; --btnfg:#fff; --ok:#6fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .label { font-size:14px; color:var(--sub); margin-bottom:8px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0 0 12px; font:inherit; user-select:all; -webkit-user-select:all; }
  button, a.btn { display:block; width:100%; padding:14px; border:0; border-radius:10px; background:var(--btn); color:var(--btnfg);
    font-size:17px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; }
  button.done { background:var(--ok); }
  a.btn.sub { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  .msg { color:var(--sub); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>返信文案</h1>
  <div id="list"><p class="msg">読み込み中…</p></div>
  <div id="slack"></div>
  <p class="msg">文案はリンクの「#」以降にだけ入っており、サーバーには送信されません。</p>
</main>
<script>
function b64urlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function decode(s) {
  const kind = s[0], bytes = b64urlToBytes(s.slice(1));
  if (kind === 'b') return new TextDecoder().decode(bytes);
  if (kind === 'z') {
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(st).text();
  }
  throw new Error('unknown format');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

(async () => {
  const list = document.getElementById('list');
  const p = new URLSearchParams(location.hash.slice(1));
  let items;
  try {
    items = JSON.parse(await decode(p.get('d') || ''));
  } catch (e) {
    list.innerHTML = '';
    list.appendChild(el('p', 'msg', '文案を読み込めませんでした（リンクが途中で切れているか、ブラウザが古い可能性があります）。'));
    return;
  }
  list.innerHTML = '';
  items.forEach((it) => {
    const card = el('div', 'card');
    if (it.l) card.appendChild(el('div', 'label', it.l));
    card.appendChild(el('pre', '', it.t));
    const b = el('button', '', items.length > 1 ? 'この文案をコピー' : 'コピー');
    b.onclick = async () => {
      const ok = await copyText(it.t);
      document.querySelectorAll('button.done').forEach(x => { x.classList.remove('done'); x.textContent = items.length > 1 ? 'この文案をコピー' : 'コピー'; });
      b.textContent = ok ? 'コピーしました ✓' : 'コピーできませんでした（本文を長押しで選択）';
      if (ok) b.classList.add('done');
    };
    card.appendChild(b);
    list.appendChild(card);
  });
  const u = p.get('u');
  if (u && /^https:\/\/[a-z0-9-]+\.slack\.com\//i.test(u)) {
    const a = el('a', 'btn sub', 'Slack のスレッドを開く');
    a.href = u;
    const c = el('div', 'card'); c.appendChild(a);
    document.getElementById('slack').appendChild(c);
  }
})();
</script>
</body>
</html>
